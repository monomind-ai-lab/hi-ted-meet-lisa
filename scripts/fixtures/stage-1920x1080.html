<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage fixture — 1920×1080</title>
<!-- Synthetic `layout: stage` fixture. Not a template and not in the
     registry: the smallest deck authored on a fixed 1920×1080 canvas that
     scales uniformly to the viewport and letterboxes on other aspect ratios,
     never re-laying its content out — the deck-stage model. It exists so
     the stage-aware mode of scripts/check_overflow.py and the layout guess
     in scripts/tedandlisa_new_template.py analyze have something to run
     against until a real stage template arrives:

         python3 scripts/check_overflow.py --layout stage scripts/fixtures/stage-1920x1080.html
         python3 scripts/tedandlisa_new_template.py analyze scripts/fixtures/stage-1920x1080.html
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #eee;
    font: 40px/1.3 system-ui, sans-serif; }
  .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform-origin: 0 0; background: #223; overflow: hidden; }
  .slide { position: absolute; inset: 0; padding: 120px; box-sizing: border-box; visibility: hidden; }
  .slide.on { visibility: visible; }
  h1 { font-size: 96px; margin: 0 0 40px; }
  p { max-width: 1400px; }
  .count { position: absolute; right: 80px; bottom: 60px; font-size: 28px; opacity: 0.6; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <section class="slide on"><h1>Fixed stage</h1><p>Authored at 1920×1080, scaled uniformly, letterboxed everywhere else.</p></section>
  <section class="slide"><h1>Second slide</h1><p>Nothing here reflows. Arrow keys move between slides.</p></section>
  <div class="count" id="count">1 / 2</div>
</div>
<script>
  var W = 1920, H = 1080, stage = document.getElementById('stage');
  function fit() {
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.left = Math.round((window.innerWidth - W * s) / 2) + 'px';
    stage.style.top = Math.round((window.innerHeight - H * s) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
  var slides = document.querySelectorAll('.slide'), at = 0;
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      at = (at + (e.key === 'ArrowRight' ? 1 : slides.length - 1)) % slides.length;
      for (var i = 0; i < slides.length; i++) { slides[i].classList.toggle('on', i === at); }
      document.getElementById('count').textContent = (at + 1) + ' / ' + slides.length;
    }
  });
</script>
</body>
</html>
